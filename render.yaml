# Render "Blueprint": tells Render how to build and run this app (free tier, no login needed to view).
# WHY a file instead of clicking settings: the settings are written down, reviewed and versioned with the code.
services:
  - type: web
    name: motor-self-inspection
    runtime: python
    plan: free
    region: singapore                 # closest Render region to India
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7                 # the version we tested with
      - key: DATA_REPO
        value: Kasimshaik2508/motor-self-inspection-data
      - key: DATA_REPO_BRANCH
        value: main
      - key: DATA_REPO_TOKEN
        sync: false                   # secret: Render asks you to paste it in the dashboard; never in this file
